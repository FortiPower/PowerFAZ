name: Release

on:
  release:
    types: [published]

jobs:
  publish-to-gallery:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Publish
        shell: pwsh
        run: |
          Publish-Module -Path ./PowerFGT -NuGetApiKey ${{ secrets.PSGALLERY_API_KEY }}
